name: Тесты и сборка APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Тесты логики
        run: ./run_tests.sh

      - name: Android SDK (build-tools 34, android-33)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-33" > /dev/null

      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p signing
            echo "$KEYSTORE_BASE64" | base64 -d > signing/shortsblocker.jks
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::Секрет KEYSTORE_BASE64 не задан — APK подписан временным ключом и не встанет поверх установленной версии. Релиз не публикуется."
            echo "SIGNED=temporary" >> "$GITHUB_ENV"
          fi

      - name: Сборка APK (компиляция с -Werror)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'shortsblocker' }}
        run: |
          BT="$ANDROID_HOME/build-tools/34.0.0" \
          ANDROID_JAR="$ANDROID_HOME/platforms/android-33/android.jar" \
          ./build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ShortsBlocker-apk
          path: app/build/apk/ShortsBlocker.apk

      - name: Релиз на GitHub (только для тегов v*, только с постоянным ключом)
        if: startsWith(github.ref, 'refs/tags/v') && env.SIGNED == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/apk/ShortsBlocker.apk \
            --title "Shorts Blocker $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md \
          || gh release upload "$GITHUB_REF_NAME" app/build/apk/ShortsBlocker.apk --clobber
